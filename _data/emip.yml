# Banner photo of the host city across the top of the homepage: a JPEG about
# 1600 px wide plus an 800 px copy; `position` picks the part a wide banner shows.
# For a photo whose license asks for credit (e.g. CC BY), add `credit`, `source`,
# `license` and `license_url`; they are then shown under it.
photo:
  src: /images/venues/2027-pamplona-river-walls-2000.jpg
  width: 2000
  height: 1326
  small: /images/venues/2027-pamplona-river-walls-800.jpg
  alt: The Arga river winding through autumn trees below Pamplona's old stone city walls and gate, with the city and hills behind under a cloudy sky
  caption: The Arga river below the old city walls, Pamplona
  position: 50% 62%
  # Free under the Unsplash License; credit is not required but Unsplash asks for it.
  credit: Maksym Diachenko on Unsplash
  source: https://unsplash.com/photos/xA9pdG-fXQM
  license: Unsplash License
  license_url: https://unsplash.com/license

