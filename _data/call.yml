# Call for papers, data challenge and submission rules on the homepage.
# Replace with the new call each year and update `source`.

source: From the EMIP 2027 workshop proposal. Deadlines and submission details will follow with the full call.

intro: >-
  EMIP 2027 welcomes a variety of contributions, such as empirical studies, investigations
  involving individuals or teams, innovative tools, visualizations, analyses and
  meta-studies, including method validation. Topics of interest include:

topics:
  - title: Eye tracking data and analysis
    text: Techniques for identifying and analyzing meaningful data abstractions in eye movement research.
  - title: Cognitive models and cognition
    text: Cognitive processes involved in software development, program comprehension and programming education.
  - title: Program representation, language paradigms and syntax
    text: Impact of textual, graphical and diagram-based program representations and language features on programmer performance and understanding.
  - title: Learner behavior and challenges
    text: How learners read, write and debug code and acquire new skills, and the obstacles they face along the way.
  - title: Applications of eye tracking
    text: Program comprehension, debugging, requirements traceability and change tracking.
  - title: Tool and process innovation
    text: Tools and processes that use eye tracking to improve programming practice, including visualizations of program execution.
  - title: Accessibility and programming assistance
    text: Programming assistance and accessibility through eye tracking technologies.
  - title: Multimodal sensing
    text: Eye tracking combined with other sensors, such as fMRI, EEG, GSR and fNIRS.
  - title: Collaborative eye tracking
    text: Multi-person eye tracking, for example in pair programming and collaborative problem solving.
  - title: Datasets and platforms for research
    text: Eye gaze datasets, such as the EMIP dataset, and platforms that support reproducible experiments.
  - title: Agentic software development and human–agent interaction
    text: AI agents that plan, code, test, debug and review, and how developers oversee, delegate to, verify and trust them, as observed through eye tracking.

challenge:
  title: Eye tracking data correction challenge
  paragraphs:
    - >-
      New this year, EMIP 2027 runs a research competition on automated correction of eye
      tracking data collected during programming tasks. Using the EMIP dataset, participants
      develop accurate, robust and efficient methods to find and correct gaze data errors
      in software engineering contexts.
    - >-
      Participants get most of the dataset, along with tools and resources to develop and
      evaluate their algorithms, and an online evaluation portal to test them during
      development. Final submissions are evaluated on a hidden, curated gold-standard portion
      of the data. The challenge sets up a shared benchmark for eye tracking data correction
      in programming research, and participants are invited to present their approaches at
      EMIP 2027.

submission:
  - label: Full papers
    text: Up to 8 pages (single column) plus references. Every paper goes through one full review cycle, and accepted papers become part of the ETRA workshop proceedings.
  - label: Work in progress
    text: Up to 4 pages (single column). Lightly reviewed and not published in the proceedings.
  - label: Review
    text: EMIP runs its own submission and review process.
