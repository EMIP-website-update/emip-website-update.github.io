<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

{% include seo.html %}

{% unless site.atom_feed.hide %}
<link href="{{ site.atom_feed.path | default: '/feed.xml' | relative_url }}" type="application/atom+xml" rel="alternate" title="{{ site.title }} Feed">
{% endunless %}

<script>document.documentElement.className = document.documentElement.className.replace(/\bno-js\b/, 'js');</script>
{%- if page.layout == 'home' %}
<script>
  // Which picture the homepage hero shows: _data/emip.yml `hero`, or ?hero= when reviewing designs.
  (function () {
    var m = /[?&]hero=([a-z-]+)/.exec(location.search);
    document.documentElement.setAttribute("data-hero", m ? m[1] : "{{ site.data.emip.hero | default: 'photo' }}");
  })();
</script>
{%- endif %}

<link rel="preload" href="{{ '/assets/fonts/source-serif-4-latin-opsz-normal.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="{{ '/assets/fonts/ibm-plex-sans-latin-400-normal.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
<link rel="icon" type="image/png" href="{{ site.logo | relative_url }}">
<meta name="theme-color" content="#fbfaf7">
