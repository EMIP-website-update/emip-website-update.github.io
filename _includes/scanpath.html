<text x="592" y="238" textLength="235" lengthAdjust="spacing">public class Rectangle {</text>
<text x="672" y="274" textLength="303" lengthAdjust="spacing">private int x1 , y1 , x2 , y2 ;</text>
<text x="672" y="310" textLength="548" lengthAdjust="spacing">public Rectangle ( int x1 , int y1 , int x2 , int y2 ) {</text>
<text x="734" y="346" textLength="137" lengthAdjust="spacing">this.x1 = x1 ;</text>

<text x="675" y="494" textLength="10" lengthAdjust="spacing">}</text>
<text x="672" y="528" textLength="499" lengthAdjust="spacing">public int width ( ) { return this.x2 - this.x1 ; }</text>
<text x="672" y="564" textLength="509" lengthAdjust="spacing">public int height ( ) { return this.y2 - this.y1 ; }</text>
<text x="672" y="600" textLength="666" lengthAdjust="spacing">public double area ( ) { return this.width ( ) * this.height ( ) ; }</text>
<text x="672" y="636" textLength="441" lengthAdjust="spacing">public static void main ( String [ ] args ) {</text>
<text x="732" y="670" textLength="519" lengthAdjust="spacing">Rectangle rect1 = new Rectangle ( 0 , 0 , 10 , 10 ) ;</text>
