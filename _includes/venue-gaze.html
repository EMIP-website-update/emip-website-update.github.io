{%- comment -%}
  Hero variant "venue-gaze": an illustrative scanpath (hand-placed fixations,
  not recorded data) drawn over the 2027 venue photo. Played by emip.js like Fig. 1.
{%- endcomment -%}
{%- assign photo = site.data.emip.photos.photo -%}
<figure class="hero-photo scanpath scanpath--venue" data-scanpath>
  <div class="hero-photo__frame">
    <img src="{{ photo.src | relative_url }}" srcset="{{ photo.small | relative_url }} 800w, {{ photo.src | relative_url }} 1400w" sizes="(min-width: 60rem) 50vw, 100vw" alt="{{ photo.alt | escape }}" loading="lazy">
    <svg viewBox="0 0 1400 1120" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
      <g class="scanpath__saccades"><line x1="585" y1="262" x2="590" y2="470" style="--t:300"/><line x1="590" y1="470" x2="468" y2="590" style="--t:680"/><line x1="468" y1="590" x2="760" y2="600" style="--t:920"/><line x1="760" y1="600" x2="1240" y2="440" style="--t:1200"/><line x1="1240" y1="440" x2="1300" y2="620" style="--t:1540"/><line x1="1300" y1="620" x2="1030" y2="900" style="--t:1860"/><line x1="1030" y1="900" x2="760" y2="1000" style="--t:2320"/><line x1="760" y1="1000" x2="640" y2="860" style="--t:2620"/><line x1="640" y1="860" x2="130" y2="650" style="--t:2840"/><line x1="130" y1="650" x2="590" y2="650" style="--t:3100"/><line x1="590" y1="650" x2="580" y2="320" style="--t:3340"/></g>
      <g class="scanpath__fixations"><g style="--t:0"><circle cx="585" cy="262" r="34.8"/></g><g style="--t:300"><circle cx="590" cy="470" r="38.5"/></g><g style="--t:680"><circle cx="468" cy="590" r="31.6"/></g><g style="--t:920"><circle cx="760" cy="600" r="33.8"/></g><g style="--t:1200"><circle cx="1240" cy="440" r="36.7"/></g><g style="--t:1540"><circle cx="1300" cy="620" r="35.8"/></g><g style="--t:1860"><circle cx="1030" cy="900" r="41.8"/></g><g style="--t:2320"><circle cx="760" cy="1000" r="34.8"/></g><g style="--t:2620"><circle cx="640" cy="860" r="30.5"/></g><g style="--t:2840"><circle cx="130" cy="650" r="32.7"/></g><g style="--t:3100"><circle cx="590" cy="650" r="31.6"/></g><g style="--t:3340"><circle cx="580" cy="320" r="40.2"/></g></g>
    </svg>
  </div>
  <figcaption>An illustrative scanpath over {{ photo.caption }}. {% include photo-credit.html photo=photo %} <button type="button" class="scanpath__replay" hidden>Replay</button></figcaption>
</figure>
