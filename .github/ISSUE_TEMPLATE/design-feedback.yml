name: Design feedback
description: Say which banner photo you prefer for the new EMIP website, and anything else.
title: "Feedback: "
labels: ["design-feedback"]
body:
  - type: markdown
    attributes:
      value: |
        Look at the picture options and the side-by-side view at https://emip-website-update.github.io/compare/ first. Everyone on the review can read this issue.
  - type: input
    id: picture
    attributes:
      label: Preferred picture
      description: A, B or C as named on the compare page, or "No preference".
    validations:
      required: true
  - type: textarea
    id: comments
    attributes:
      label: Comments
      description: Optional. What works, what doesn't, what's missing.
